<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Duel · generated</title>
<style>
:root {
  --bg: #16161a; --panel: #1f1f25; --line: #2e2e36; --text: #ececf1; --muted: #9a9aa8;
  --accent: #f2b84b; --a: #5fb3ff; --b: #ff7a8a; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { border-color: #4a4a55; }
button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; background: rgba(22,22,26,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; }
.tabs, .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls label { color: var(--muted); font-size: 12px; margin-left: 4px; }
main { padding: 16px; max-width: 2200px; margin: 0 auto; }
.hint { color: var(--muted); font-size: 12px; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; color: var(--text); }
.pane { display: none; } .pane.active { display: block; }

/* duel */
.duel-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.tagA { color: var(--a); font-weight: 650; } .tagB { color: var(--b); font-weight: 650; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9;
  border: 2px solid transparent; }
.card.A { border-color: var(--a); } .card.B { border-color: var(--b); }
.card img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.cap { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.65);
  font-size: 12px; font-weight: 600; pointer-events: none; }
.missing { display: grid; place-items: center; width: 100%; height: 100%; color: var(--muted); }
.swipe { position: relative; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; background: #000;
  cursor: ew-resize; user-select: none; touch-action: none; max-height: calc(100vh - 190px); margin: 0 auto; }
.swipe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.swipe .topA { clip-path: inset(0 50% 0 0); }
.swipe .divider { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; left: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4); pointer-events: none; }
.swipe .capA { left: 8px; color: var(--a); } .swipe .capB { left: auto; right: 8px; color: var(--b); }
.vote { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.vote button { padding: 10px 18px; font-weight: 650; }
.vote .va { border-color: var(--a); color: var(--a); } .vote .vb { border-color: var(--b); color: var(--b); }
.progress { color: var(--muted); font-size: 12px; text-align: center; margin-top: 6px; }

/* grids */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
.grid .card { border-color: var(--line); }
h2 { font-size: 16px; margin: 4px 0 12px; font-weight: 650; scroll-margin-top: 70px; }
#styleList h2, #gameList h2 { margin-top: 28px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.jump a { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; background: var(--panel); }
.jump a:hover { border-color: #4a4a55; }

/* ranking */
table { border-collapse: collapse; width: 100%; max-width: 1100px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; min-width: 120px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.scroll { overflow-x: auto; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); display: none; place-items: center; }
.lb.open { display: grid; }
.lb img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
.lb .cap { top: 12px; left: 12px; font-size: 14px; }

@media (max-width: 900px) { .side { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Style Duel</h1>
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <label>Игра</label><select id="game"></select>
    <span id="duelControls" class="controls">
      <label class="tagA">A</label><select id="styleA"></select>
      <button id="swap" title="Поменять A и B">⇄</button>
      <label class="tagB">B</label><select id="styleB"></select>
      <button id="viewBtn" title="S">Шторка</button>
    </span>
  </div>
  <span class="hint" style="margin-left:auto">
    <kbd>←</kbd>/<kbd>→</kbd> голос · <kbd>S</kbd> шторка · <kbd>[</kbd>/<kbd>]</kbd> игра · <kbd>F</kbd> весь экран · <kbd>Esc</kbd>
  </span>
</header>

<main>
  <section class="pane" id="pane-duel">
    <div id="duelView"></div>
    <div class="vote">
      <button class="va" id="voteA">← A лучше</button>
      <button id="skip">Пропустить</button>
      <button class="vb" id="voteB">B лучше →</button>
    </div>
    <div class="progress" id="progress"></div>
  </section>
  <section class="pane" id="pane-game"><nav class="jump" id="gameJump"></nav><div id="gameList"></div></section>
  <section class="pane" id="pane-style"><nav class="jump" id="styleJump"></nav><div id="styleList"></div></section>
  <section class="pane" id="pane-rank">
    <div class="duel-bar"><h2 style="margin:0">Рейтинг по дуэлям</h2><button id="reset">Сбросить голоса</button></div>
    <div class="scroll" id="rank"></div>
  </section>
</main>

<div class="lb" id="lb"><img id="lbImg" alt=""><span class="cap" id="lbCap"></span></div>

<script>
const DATA = {"title": "generated", "games": [{"id": "29_magnificent_mime", "label": "Magnificent Mime"}, {"id": "35_vampire_vegan", "label": "Vampire Vegan"}, {"id": "37_coupon_queen", "label": "Coupon Queen"}], "styles": [{"id": "manga-tone-original", "label": "Manga Tone Original"}, {"id": "manga-tone-v1", "label": "Manga Tone V1"}, {"id": "manga-tone-v2", "label": "Manga Tone V2"}, {"id": "manga-tone-v3", "label": "Manga Tone V3"}, {"id": "manga-tone-v4", "label": "Manga Tone V4"}, {"id": "manga-tone-v5", "label": "Manga Tone V5"}, {"id": "manga-tone-v6", "label": "Manga Tone V6"}, {"id": "manga-tone-v7", "label": "Manga Tone V7"}, {"id": "manga-tone-v8", "label": "Manga Tone V8"}], "images": {"35_vampire_vegan--manga-tone-original": "35_vampire_vegan--manga-tone-original.png"}};
const KEY = "style-duel:" + DATA.title;
const games = DATA.games, styles = DATA.styles;
const label = (list, id) => (list.find(x => x.id === id) || {label: id}).label;
// Images are looked up by name at view time, so the page keeps working even if it was
// built before the images existed. Files that fail to load are marked missing.
const missing = new Set();
const has = (g, s) => !missing.has(g + "--" + s);
const src = (g, s) => DATA.images[g + "--" + s] || g + "--" + s + ".png";
let rerender = 0;
function miss(g, s) {
  const k = g + "--" + s;
  if (missing.has(k)) return;
  missing.add(k);
  if (state.game === g && (state.a === s || state.b === s)) setPair(state.pairIdx);
  cancelAnimationFrame(rerender); rerender = requestAnimationFrame(() => render());
}

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const state = Object.assign({ tab: "duel", view: "side", game: games[0].id, a: null, b: null,
  style: styles[0].id, votes: [], pairIdx: 0 }, load());
if (!games.some(g => g.id === state.game)) state.game = games[0].id;
if (!styles.some(s => s.id === state.style)) state.style = styles[0].id;

// every game x every pair of styles that both have images
const pairs = [];
games.forEach(g => {
  const av = styles.filter(s => has(g.id, s.id));
  for (let i = 0; i < av.length; i++) for (let j = i + 1; j < av.length; j++) pairs.push([g.id, av[i].id, av[j].id]);
});
function setPair(i) {
  if (!pairs.length) return;
  for (let n = 0; n < pairs.length; n++, i++) {
    const [g, a, b] = pairs[((i % pairs.length) + pairs.length) % pairs.length];
    if (has(g, a) && has(g, b)) break;
  }
  state.pairIdx = ((i % pairs.length) + pairs.length) % pairs.length;
  const [g, a, b] = pairs[state.pairIdx];
  state.game = g; state.a = a; state.b = b;
}
if (!state.a || !state.b || !has(state.game, state.a) || !has(state.game, state.b)) setPair(state.pairIdx || 0);

const $ = id => document.getElementById(id);
function fill(sel, list, val) {
  sel.innerHTML = list.map(x => `<option value="${x.id}">${x.label}</option>`).join("");
  sel.value = val;
}
const TABS = [["duel", "Дуэль"], ["game", "Игра: все стили"], ["style", "Стиль: все игры"], ["rank", "Рейтинг"]];
$("tabs").innerHTML = TABS.map(([id, t]) => `<button data-tab="${id}">${t}</button>`).join("");
$("tabs").onclick = e => { const t = e.target.dataset.tab; if (t) { state.tab = t; render(); } };

function imgCard(g, s, cls, cap) {
  if (!has(g, s)) return `<div class="card ${cls}"><div class="missing">нет картинки</div><span class="cap">${cap}</span></div>`;
  return `<div class="card ${cls}"><img loading="lazy" src="${src(g, s)}" onerror="miss('${g}','${s}')" data-g="${g}" data-s="${s}" alt="${cap}"><span class="cap">${cap}</span></div>`;
}

function renderDuel() {
  const g = state.game, a = state.a, b = state.b;
  const la = label(styles, a), lb = label(styles, b);
  $("viewBtn").textContent = state.view === "side" ? "Шторка" : "Рядом";
  if (state.view === "side") {
    $("duelView").innerHTML = `<div class="side">${imgCard(g, a, "A", "A · " + la)}${imgCard(g, b, "B", "B · " + lb)}</div>`;
  } else {
    $("duelView").innerHTML = `<div class="swipe" id="swipe">
      <img src="${src(g, b)}" onerror="miss('${g}','${b}')" alt="B"><img class="topA" id="topA" src="${src(g, a)}" onerror="miss('${g}','${a}')" alt="A">
      <div class="divider" id="divider"></div>
      <span class="cap capA">A · ${la}</span><span class="cap capB">B · ${lb}</span></div>`;
    const sw = $("swipe");
    const move = x => {
      const r = sw.getBoundingClientRect();
      const p = Math.max(0, Math.min(100, (x - r.left) / r.width * 100));
      $("topA").style.clipPath = `inset(0 ${100 - p}% 0 0)`;
      $("divider").style.left = p + "%";
    };
    sw.onpointermove = e => move(e.clientX);
    sw.onpointerdown = e => move(e.clientX);
  }
  const done = state.votes.length;
  $("progress").textContent = pairs.length
    ? `Пара ${state.pairIdx + 1} из ${pairs.length} · голосов: ${done}`
    : "Нужно минимум 2 стиля с картинками в одной игре";
}

// every game one under another, each with all styles; chips at the top jump to a game
function renderGame() {
  $("gameJump").innerHTML = games.length > 1
    ? games.map(g => `<a href="#gm-${g.id}">${g.label}</a>`).join("") : "";
  $("gameList").innerHTML = games.map(g =>
    `<h2 id="gm-${g.id}">${g.label}</h2><div class="grid">${styles.map(s => imgCard(g.id, s.id, "", s.label)).join("")}</div>`
  ).join("");
}
// every style one under another, each with all games; chips at the top jump to a style
function renderStyle() {
  $("styleJump").innerHTML = styles.length > 1
    ? styles.map(s => `<a href="#st-${s.id}">${s.label}</a>`).join("") : "";
  $("styleList").innerHTML = styles.map(s =>
    `<h2 id="st-${s.id}">${s.label}</h2><div class="grid">${games.map(g => imgCard(g.id, s.id, "", g.label)).join("")}</div>`
  ).join("");
}
function renderRank() {
  const stat = {}; styles.forEach(s => stat[s.id] = { w: 0, l: 0, games: {} });
  state.votes.forEach(v => {
    if (!stat[v.w] || !stat[v.l]) return;
    stat[v.w].w++; stat[v.l].l++;
    (stat[v.w].games[v.g] ||= { w: 0, l: 0 }).w++;
    (stat[v.l].games[v.g] ||= { w: 0, l: 0 }).l++;
  });
  const pct = (w, l) => w + l ? Math.round(100 * w / (w + l)) : null;
  const rows = styles.map(s => ({ s, ...stat[s.id], p: pct(stat[s.id].w, stat[s.id].l) }))
    .sort((x, y) => (y.p ?? -1) - (x.p ?? -1) || y.w - x.w);
  const head = `<tr><th>#</th><th>Стиль</th><th>Победы</th><th>Поражения</th><th>% побед</th><th></th>` +
    games.map(g => `<th>${g.label}</th>`).join("") + `</tr>`;
  const body = rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${r.s.label}</td>
    <td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${r.p ?? "—"}${r.p == null ? "" : "%"}</td>
    <td><div class="bar"><i style="width:${r.p || 0}%"></i></div></td>` +
    games.map(g => { const x = r.games[g.id]; const p = x ? pct(x.w, x.l) : null; return `<td class="num">${p == null ? "—" : p + "%"}</td>`; }).join("") +
    `</tr>`).join("");
  $("rank").innerHTML = state.votes.length
    ? `<table>${head}${body}</table>`
    : `<p class="hint">Голосов пока нет. Откройте «Дуэль» и выбирайте лучшую картинку клавишами ← и →.</p>`;
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === "pane-" + state.tab));
  $("duelControls").style.display = state.tab === "duel" ? "" : "none";
  $("game").parentElement.style.display = "";
  $("game").style.display = $("game").previousElementSibling.style.display = state.tab === "duel" ? "" : "none";
  fill($("game"), games, state.game);
  fill($("styleA"), styles, state.a); fill($("styleB"), styles, state.b);
  ({ duel: renderDuel, game: renderGame, style: renderStyle, rank: renderRank })[state.tab]();
  save();
}

function vote(winner) {
  if (!pairs.length || !has(state.game, state.a) || !has(state.game, state.b)) return;
  const [w, l] = winner === "A" ? [state.a, state.b] : [state.b, state.a];
  state.votes.push({ g: state.game, w, l });
  setPair(state.pairIdx + 1); render();
}
function stepGame(d) {
  const i = games.findIndex(g => g.id === state.game);
  state.game = games[(i + d + games.length) % games.length].id;
  if (state.tab === "duel") {
    const j = pairs.findIndex(p => p[0] === state.game && p[1] === state.a && p[2] === state.b);
    if (j >= 0) state.pairIdx = j; else { const k = pairs.findIndex(p => p[0] === state.game); if (k >= 0) setPair(k); }
  }
  render();
}

$("game").onchange = e => { state.game = e.target.value; stepGame(0); };
$("styleA").onchange = e => { state.a = e.target.value; render(); };
$("styleB").onchange = e => { state.b = e.target.value; render(); };
$("swap").onclick = () => { [state.a, state.b] = [state.b, state.a]; render(); };
$("viewBtn").onclick = () => { state.view = state.view === "side" ? "swipe" : "side"; render(); };
$("voteA").onclick = () => vote("A");
$("voteB").onclick = () => vote("B");
$("skip").onclick = () => { setPair(state.pairIdx + 1); render(); };
$("reset").onclick = () => { if (confirm("Удалить все голоса?")) { state.votes = []; state.pairIdx = 0; setPair(0); render(); } };

// lightbox: click any image; arrows step through the images currently on screen
let lbList = [], lbIdx = 0;
function openLb(list, i) { lbList = list; lbIdx = i; showLb(); $("lb").classList.add("open"); }
function showLb() {
  const it = lbList[lbIdx]; if (!it) return;
  $("lbImg").src = src(it.g, it.s);
  $("lbCap").textContent = `${label(games, it.g)} · ${label(styles, it.s)}  (${lbIdx + 1}/${lbList.length})`;
}
const closeLb = () => $("lb").classList.remove("open");
$("lb").onclick = closeLb;
document.querySelector("main").addEventListener("click", e => {
  const img = e.target.closest("img[data-g]"); if (!img) return;
  const list = [...document.querySelectorAll(".pane.active img[data-g]")].map(x => ({ g: x.dataset.g, s: x.dataset.s }));
  openLb(list, list.findIndex(x => x.g === img.dataset.g && x.s === img.dataset.s));
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ($("lb").classList.contains("open")) {
    if (k === "Escape" || k === "f" || k === "F") closeLb();
    else if (k === "ArrowRight") { lbIdx = (lbIdx + 1) % lbList.length; showLb(); }
    else if (k === "ArrowLeft") { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); }
    return;
  }
  if (state.tab === "duel" && k === "ArrowLeft") { e.preventDefault(); vote("A"); }
  else if (state.tab === "duel" && k === "ArrowRight") { e.preventDefault(); vote("B"); }
  else if (state.tab === "duel" && (k === "s" || k === "S")) $("viewBtn").click();
  else if (k === "]" || k === "g" || k === "G") stepGame(1);
  else if (k === "[") stepGame(-1);
  else if (k === "f" || k === "F") {
    const imgs = [...document.querySelectorAll(".pane.active img[data-g]")].map(x => ({ g: x.dataset.g, s: x.dataset.s }));
    if (state.tab === "duel" && state.view === "swipe") imgs.push({ g: state.game, s: state.a }, { g: state.game, s: state.b });
    if (imgs.length) openLb(imgs, 0);
  }
});

render();
</script>
</body>
</html>
